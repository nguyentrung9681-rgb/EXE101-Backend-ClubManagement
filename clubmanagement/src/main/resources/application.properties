# Import cấu hình từ file .env (ở thư mục hiện tại hoặc thư mục cha)
spring.config.import=optional:file:.env[.properties],optional:file:../.env[.properties]

spring.application.name=SClubDB
server.port=${PORT:8080}
server.forward-headers-strategy=framework
app.base-url=${APP_BASE_URL:https://exe101-backend-clubmanagement.onrender.com}
#spring.application.name=EXE101_S_Club

# Cau hinh ket noi PostgreSQL (Supabase)
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
# Gioi han so luong connection cua Hikari de tranh vuot qua max clients (15) cua Supabase Session Mode
spring.datasource.hikari.maximum-pool-size=4
spring.datasource.hikari.minimum-idle=2

# Cau hinh Hibernate JPA
# SECURITY: Disable SQL logging in production (tránh lộ query data vào log)
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=false

# Cau hinh Flyway migration
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1

# Cấu hình bảo mật Google OAuth2
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET}
spring.security.oauth2.client.registration.google.scope=openid,email,profile,https://www.googleapis.com/auth/calendar,https://www.googleapis.com/auth/spreadsheets,https://www.googleapis.com/auth/documents,https://www.googleapis.com/auth/drive.file
google.redirect-uri=${GOOGLE_REDIRECT_URI}
google.webhook-url=${GOOGLE_WEBHOOK_URL:https://yourdomain.com}

# Cấu hình Key bảo mật để tạo chuỗi JWT
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-ms=${JWT_EXPIRATION}

# Cấu hình Gửi Email (Spring Mail SMTP SSL - Cổng 465 cho Render Cloud)
spring.mail.host=${SPRING_MAIL_HOST:smtp.gmail.com}
spring.mail.port=${SPRING_MAIL_PORT:465}
spring.mail.username=${SPRING_MAIL_USERNAME:${spring_mail_username:}}
spring.mail.password=${SPRING_MAIL_PASSWORD:${spring_mail_password:}}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.ssl.enable=true
spring.mail.properties.mail.smtp.ssl.trust=smtp.gmail.com
spring.mail.properties.mail.smtp.connectiontimeout=10000
spring.mail.properties.mail.smtp.timeout=10000
spring.mail.properties.mail.smtp.writetimeout=10000

# Resend Email API Config (Gửi qua HTTPS Port 443 không bị Render chặn)
resend.api-key=${RESEND_API_KEY:}
resend.from-email=${RESEND_FROM_EMAIL:onboarding@resend.dev}

# PayOS Config
payos.client-id=${PAYOS_CLIENT_ID:}
payos.api-key=${PAYOS_API_KEY:}
payos.checksum-key=${PAYOS_CHECKSUM_KEY:}

# URL của Frontend để PayOS chuyển hướng sau khi user tương tác xong
payos.return-url=${PAYOS_RETURN_URL:https://exe-ebon.vercel.app/payment/success}
payos.cancel-url=${PAYOS_CANCEL_URL:https://exe-ebon.vercel.app/payment/cancel}

# URL của Frontend Calendar & Trello & OAuth2 Redirect để chuyển hướng sau khi kết nối thành công
app.frontend.calendar-url=${FRONTEND_CALENDAR_URL:https://exe-ebon.vercel.app/calendar}
app.frontend.trello-url=${TRELLO_REDIRECT_URI:${FRONTEND_TRELLO_URL:https://exe-ebon.vercel.app/api/trello/callback}}
app.frontend.redirect-url=${FRONTEND_REDIRECT_URL:https://exe-ebon.vercel.app}

# Trello Config
trello.api-key=${TRELLO_API_KEY:}
trello.redirect-uri=${TRELLO_REDIRECT_URI:https://exe-ebon.vercel.app/api/trello/callback}

# SECURITY: Giới hạn kích thước file upload (tối đa 10MB per file, 20MB per request)
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=20MB

# SECURITY: Ẩn thông tin chi tiết lỗi trong response (không lộ stacktrace ra ngoài)
server.error.include-message=never
server.error.include-binding-errors=never
server.error.include-stacktrace=never
server.error.include-exception=false

# SECURITY (Anti-DoS / Anti-Slowloris): Cấu hình Server Tomcat timeouts & connection limits
server.tomcat.connection-timeout=20000
server.tomcat.keep-alive-timeout=15000
server.tomcat.max-keep-alive-requests=100
server.tomcat.max-threads=200
server.tomcat.min-spare-threads=10

# SECURITY (Anti-DoS Layer 7 Rate Limiting): Cấu hình giới hạn tần suất request per IP (requests/phút)
app.security.rate-limit.enabled=true
app.security.rate-limit.general-capacity=60
app.security.rate-limit.auth-capacity=15
